name: Setup Node Cached
description: setup-node + npm ci (le job doit faire checkout avant)
inputs:
  node-version:
    description: Version de Node.js
    required: true
    default: "18"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - name: Installation des dépendances
      run: npm ci
      shell: bash
