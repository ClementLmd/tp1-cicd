name: CI — Lint, Tests & Coverage

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "src/**"
      - "package*.json"
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node (composite action)
        uses: ./.github/actions/setup-node-cached
        with:
          node-version: "18"
      - name: Vérification ESLint
        run: npm run lint

  test:
    uses: ./.github/workflows/test-reusable.yml
    with:
      node-versions: "[18, 20]"
      coverage-threshold: 80

  report:
    name: 📊 Rapport Coverage
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger tous les rapports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-node-*
          merge-multiple: false
          path: all-coverage/
      - name: Afficher le résumé dans Step Summary
        run: |
          echo '## 📊 Rapport de Couverture' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '| Version | Statements | Branches | Functions | Lines |' >> $GITHUB_STEP_SUMMARY
          echo '|---------|-----------|---------|----------|-------|' >> $GITHUB_STEP_SUMMARY
          for dir in all-coverage/coverage-node-*/; do
            version=$(basename "$dir" | sed 's/coverage-node-//')
            summary="$dir/coverage-summary.json"
            if [ -f "$summary" ]; then
              node -e "
                const d = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).total;
                const v = process.argv[2];
                console.log('| Node ' + v + ' | ' + d.statements.pct + '% | ' + d.branches.pct + '% | ' + d.functions.pct + '% | ' + d.lines.pct + '% |');
              " "$summary" "$version" >> $GITHUB_STEP_SUMMARY
            fi
          done
      - name: Afficher le coverage (outputs + seuil 80%)
        env:
          THRESHOLD: 80
          LINES_18: ${{ needs.test.outputs.lines-18 }}
          LINES_20: ${{ needs.test.outputs.lines-20 }}
        run: |
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '## 🎯 Couverture (reusable workflow outputs)' >> $GITHUB_STEP_SUMMARY
          node -e "
            const threshold = Number(process.env.THRESHOLD);
            const rows = [
              ['18', process.env.LINES_18],
              ['20', process.env.LINES_20],
            ];
            for (const [ver, pct] of rows) {
              if (!pct) continue;
              const n = Number(pct);
              const emoji = n >= threshold ? '✅' : '❌';
              console.log('- Node ' + ver + ' : **' + pct + '%** ' + emoji + ' (seuil ' + threshold + '%)');
            }
          " >> $GITHUB_STEP_SUMMARY
      - name: Résultat global CI
        run: |
          lint_ok='${{ needs.lint.result }}'
          test_ok='${{ needs.test.result }}'
          echo "Lint: $lint_ok | Tests: $test_ok"
          if [ "$lint_ok" != 'success' ] || [ "$test_ok" != 'success' ]; then
            echo '❌ CI échoué' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo '✅ CI complet — tous les jobs sont verts' >> $GITHUB_STEP_SUMMARY
