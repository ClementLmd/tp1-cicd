name: CI — Lint, Tests & Coverage

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "src/**"
      - "package*.json"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
      - name: Installation des dépendances
        run: npm ci
      - name: Vérification ESLint
        run: npm run lint

  test:
    name: 🧪 Tests — Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]
    outputs:
      lines: ${{ steps.coverage.outputs.lines }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Installation des dépendances
        run: npm ci
      - name: Tests unitaires + couverture
        run: npm run test:ci
      - name: Calculer le coverage total
        id: coverage
        run: |
          PCT=$(node -e "const d=JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')); console.log(d.total.lines.pct)")
          echo "lines=$PCT" >> $GITHUB_OUTPUT
          echo "Coverage lines (Node ${{ matrix.node-version }}): ${PCT}%"
      - name: Upload rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 14

  merge-coverage:
    name: 📦 Agrégation outputs coverage
    runs-on: ubuntu-latest
    needs: test
    if: always()
    outputs:
      lines-18: ${{ steps.aggregate.outputs.lines-18 }}
      lines-20: ${{ steps.aggregate.outputs.lines-20 }}
    steps:
      - name: Télécharger les rapports coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-node-*
          merge-multiple: false
          path: coverage-artifacts/
      - name: Agréger les outputs (matrix → job unique)
        id: aggregate
        run: |
          read_pct() {
            node -e "
              try {
                const p = process.argv[1];
                const d = JSON.parse(require('fs').readFileSync(p, 'utf8'));
                console.log(d.total.lines.pct);
              } catch {
                console.log('');
              }
            " "$1"
          }
          L18=$(read_pct "coverage-artifacts/coverage-node-18/coverage-summary.json")
          L20=$(read_pct "coverage-artifacts/coverage-node-20/coverage-summary.json")
          echo "lines-18=$L18" >> $GITHUB_OUTPUT
          echo "lines-20=$L20" >> $GITHUB_OUTPUT

  report:
    name: 📊 Rapport Coverage
    runs-on: ubuntu-latest
    needs: [lint, test, merge-coverage]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger tous les rapports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-node-*
          merge-multiple: false
          path: all-coverage/
      - name: Afficher le résumé dans Step Summary
        run: |
          echo '## 📊 Rapport de Couverture' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '| Version | Statements | Branches | Functions | Lines |' >> $GITHUB_STEP_SUMMARY
          echo '|---------|-----------|---------|----------|-------|' >> $GITHUB_STEP_SUMMARY
          for dir in all-coverage/coverage-node-*/; do
            version=$(basename "$dir" | sed 's/coverage-node-//')
            summary="$dir/coverage-summary.json"
            if [ -f "$summary" ]; then
              node -e "
                const d = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).total;
                const v = process.argv[2];
                console.log('| Node ' + v + ' | ' + d.statements.pct + '% | ' + d.branches.pct + '% | ' + d.functions.pct + '% | ' + d.lines.pct + '% |');
              " "$summary" "$version" >> $GITHUB_STEP_SUMMARY
            fi
          done
      - name: Afficher le coverage (outputs + seuil 80%)
        env:
          THRESHOLD: 80
          LINES_18: ${{ needs.merge-coverage.outputs.lines-18 }}
          LINES_20: ${{ needs.merge-coverage.outputs.lines-20 }}
        run: |
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '## 🎯 Couverture (job outputs)' >> $GITHUB_STEP_SUMMARY
          node -e "
            const threshold = Number(process.env.THRESHOLD);
            const rows = [
              ['18', process.env.LINES_18],
              ['20', process.env.LINES_20],
            ];
            for (const [ver, pct] of rows) {
              if (!pct) continue;
              const n = Number(pct);
              const emoji = n >= threshold ? '✅' : '❌';
              console.log('- Node ' + ver + ' : **' + pct + '%** ' + emoji + ' (seuil ' + threshold + '%)');
            }
          " >> $GITHUB_STEP_SUMMARY
      - name: Résultat global CI
        run: |
          lint_ok='${{ needs.lint.result }}'
          test_ok='${{ needs.test.result }}'
          echo "Lint: $lint_ok | Tests: $test_ok"
          if [ "$lint_ok" != 'success' ] || [ "$test_ok" != 'success' ]; then
            echo '❌ CI échoué' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo '✅ CI complet — tous les jobs sont verts' >> $GITHUB_STEP_SUMMARY
